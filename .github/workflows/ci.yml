name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Branch pushes supersede each other; every main commit keeps its own run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan
        run: ./gitleaks git --redact --verbose .

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No env files tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then echo "Tracked env files: $tracked"; exit 1; fi
      - name: Shell scripts parse
        run: bash -n .githooks/check-plan.sh scripts/plan scripts/demo-up.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Demo scripts (demo-up.sh with a fake Keychain and call check, demo-owner.mjs with a fake CLI)
        working-directory: scripts
        run: |
          status=0
          node --test test/demo-owner.test.mjs test/demo-up.test.mjs > test.log 2>&1 || status=$?
          cat test.log
          test "$status" -eq 0
          grep -qE '^# fail 0$' test.log
          pass=$(awk '/^# pass/ {print $3}' test.log)
          echo "passing tests: $pass"
          test "$pass" -ge 44
      - name: PLAN.md table is intact
        run: |
          rows=$(grep -cE '^\| [0-9]+\.[0-9]+ \|' PLAN.md)
          echo "PLAN.md task rows: $rows"
          test "$rows" -ge 10

  form-errand:
    name: Apify form-errand Actor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apify/form-errand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apify/form-errand/package-lock.json
      - run: npm ci
      - name: Install the Chromium that matches playwright 1.61.1
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - name: Tests (unit and real browser)
        run: |
          # Capture the status without letting bash -e stop the step before the log prints.
          status=0
          npm test > test.log 2>&1 || status=$?
          cat test.log
          test "$status" -eq 0
          grep -qE '^# fail 0$' test.log
          # Floor on passing tests, so a run that finds no tests cannot pass.
          pass=$(awk '/^# pass/ {print $3}' test.log)
          echo "passing tests: $pass"
          test "$pass" -ge 46

  apify-client:
    name: Apify client (search, places, errand)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apify/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apify/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Tests
        run: |
          status=0
          npm test > test.log 2>&1 || status=$?
          cat test.log
          test "$status" -eq 0
          grep -qE '^# fail 0$' test.log
          pass=$(awk '/^# pass/ {print $3}' test.log)
          echo "passing tests: $pass"
          test "$pass" -ge 192

  cartesia:
    name: Cartesia (speech, voice, call)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cartesia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cartesia/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Tests (network blocked)
        run: |
          status=0
          npm test > test.log 2>&1 || status=$?
          cat test.log
          test "$status" -eq 0
          grep -qE '^# fail 0$' test.log
          pass=$(awk '/^# pass/ {print $3}' test.log)
          echo "passing tests: $pass"
          test "$pass" -ge 167

  moss:
    name: Moss (memory and web retrieval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moss/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Tests (fake SDK, no credentials)
        run: |
          status=0
          npm test > test.log 2>&1 || status=$?
          cat test.log
          test "$status" -eq 0
          grep -qE '^# fail 0$' test.log
          pass=$(awk '/^# pass/ {print $3}' test.log)
          echo "passing tests: $pass"
          test "$pass" -ge 75

  spacetime:
    name: SpacetimeDB module (scan clock, dead-man pause, consent gate, roles)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spacetime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spacetime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (in-memory test datastore, no server)
        run: |
          status=0
          npx vitest run --reporter=default --reporter=json --outputFile.json=test.json > test.log 2>&1 || status=$?
          cat test.log
          test "$status" -eq 0
          failed=$(node -e "console.log(require('./test.json').numFailedTests)")
          pass=$(node -e "console.log(require('./test.json').numPassedTests)")
          echo "passing tests: $pass, failing: $failed"
          test "$failed" -eq 0
          # Floor on passing tests, so a run that finds no tests cannot pass.
          test "$pass" -ge 177

  web:
    name: Web dashboard (typecheck, tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (sample replay and screen models, no server)
        run: |
          status=0
          npm test > test.log 2>&1 || status=$?
          cat test.log
          test "$status" -eq 0
          grep -qE '^# fail 0$' test.log
          pass=$(awk '/^# pass/ {print $3}' test.log)
          echo "passing tests: $pass"
          test "$pass" -ge 524
      - run: npm run build

  telemetry:
    name: Tiger Data telemetry (schema, writer, stats, pinned TLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            spacetime/package-lock.json
            telemetry/package-lock.json
      - name: Install (the generated SpacetimeDB bindings resolve spacetimedb from spacetime/)
        run: |
          npm ci --prefix spacetime
          npm ci --prefix telemetry
      - name: Typecheck
        working-directory: telemetry
        run: npm run typecheck
      - name: Tests (no network; a local TLS server with throwaway certificates)
        working-directory: telemetry
        run: |
          status=0
          npm test > test.log 2>&1 || status=$?
          cat test.log
          test "$status" -eq 0
          grep -qE '^# fail 0$' test.log
          pass=$(awk '/^# pass/ {print $3}' test.log)
          echo "passing tests: $pass"
          test "$pass" -ge 134

  agent:
    name: Agent sidecar (Claude planner, errand and call wiring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apify/client/package-lock.json
            moss/package-lock.json
            cartesia/package-lock.json
            spacetime/package-lock.json
            agent/package-lock.json
      - name: Build the packages the sidecar imports
        run: |
          for p in apify/client moss cartesia; do
            npm ci --prefix "$p"
            npm run build --prefix "$p"
          done
          npm ci --prefix spacetime
      - name: Install
        working-directory: agent
        run: npm ci
      - name: Typecheck (including the generated SpacetimeDB bindings)
        working-directory: agent
        run: npm run typecheck
      - name: Tests (fakes for Claude, Apify, Moss, Cartesia and the database)
        working-directory: agent
        run: |
          status=0
          npm test > test.log 2>&1 || status=$?
          cat test.log
          test "$status" -eq 0
          grep -qE '^# fail 0$' test.log
          pass=$(awk '/^# pass/ {print $3}' test.log)
          echo "passing tests: $pass"
          test "$pass" -ge 306
